task_id: viz_render_surface_1ubq_001
category: visualization
bucket: synthesis
difficulty: easy
dimensions: [actionability, semantic_grounding]
initial_state:
  files: [1ubq.pdb]
  pdb: 1UBQ
  molecules_loaded: false
allowed_interface: [raw_tcl]
# Picture-level check on a solid molecular surface: 1UBQ (ubiquitin) as QuickSurface
# (no MSMS dependency, works headless) colored by element on a white background.
# image_foreground confirms the surface actually rendered; image_palette confirms the
# element coloring produced several distinct colors. Bands calibrated from the oracle
# gold (coverage 0.155, 10 distinct) via score-oracle.
user_prompt: >
  Load 1UBQ, display the protein as a molecular surface colored by element, set a white
  background, and render the scene to out.tga.
verify:
  required:
    - {kind: molecule_loaded,       where: {}}
    - {kind: representation_exists, where: {style: QuickSurf}}
    - {kind: file_rendered,         where: {path: out.tga, must_be_image: true, min_bytes: 1000}}
    - {kind: image_foreground,      where: {path: out.tga, background: white, check_background: true, min_coverage: 0.02}}
    - {kind: image_palette,         where: {path: out.tga, min_distinct: 3}}
  optional:
    - {kind: no_runtime_errors,     where: {}}
reproducibility:
  exports: [tcl]
  replay_clean: true
